<text x="650" y="238.88" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#223945" font-weight="400">把风险集中在一段可观察的接近过程，考验</text>
<text x="650" y="261.88" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#223945" font-weight="400">落点与行动时机。</text>
<text x="650" y="310.64" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#7958A0" font-weight="700">通风 · 绕行，操作成本</text>
<text x="650" y="338.88" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#223945" font-weight="400">经 A 到 10 会议室，推柜攀入风道，从 06</text>
<text x="650" y="361.88" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#223945" font-weight="400">离开。</text>
<text x="650" y="384.88" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#223945" font-weight="400">用绕行和操作成本换取避开 B 门聚集区；到</text>
<text x="650" y="407.88" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#223945" font-weight="400">行政区后仍需走向配电间。</text>
<rect x="38" y="535" width="884" height="49" fill="#E0E9E6" stroke="none" stroke-width="1"/>
<text x="52" y="556.88" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#223945" font-weight="400">汇合后：D 门进 07 取保险丝 → 从内侧解锁 C → 回电梯；C 外侧不能解锁。</text>
<polyline points="38,627 922,627" fill="none" stroke="#C8D1D0" stroke-width="0.7" />
<text x="38" y="647.66" font-family="Microsoft YaHei, sans-serif" font-size="10.5" fill="#526771" font-weight="400">林顺  /  封锁区：零号大厦  /  关卡设计与玩法机制</text>
<text x="886" y="645.2" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#526771" font-weight="400">02 / 10</text>
<text x="38" y="612.66" font-family="Microsoft YaHei, sans-serif" font-size="10.5" fill="#526771" font-weight="400">① 对应下一页 B 门实机视角；家具省略。地面玩家可从 D04 进 06，两条路线均经 D 前往配电间。</text></svg></section>
<section id="page-3"><svg viewBox="0 0 960 675" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="960" height="675" fill="#F4F3EE" stroke="none" stroke-width="1"/>
<rect x="38" y="32" width="28" height="4" fill="#157E7C" stroke="none" stroke-width="1"/>
<text x="77" y="35.120000000000005" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#157E7C" font-weight="700">PLAYER VIEW / 03</text>
<text x="38" y="82.68" font-family="Microsoft YaHei, sans-serif" font-size="29" fill="#223945" font-weight="700">门在眼前，解法需要先观察</text>
<text x="38" y="111.96000000000001" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#526771" font-weight="400">把“看见目标”和“能够通过”分开：先留出观察距离，再让玩家选择何时接近门口。</text>
<image href="assets/b_infected.jpg" x="38.0" y="145.0" width="628.0" height="353.25"/>
<polyline points="405,297 369,314" fill="none" stroke="#B45342" stroke-width="1.2" />
<circle cx="413" cy="291" r="10" fill="#FFFFFF"/>
<text x="409" y="294.04" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#B45342" font-weight="700">1</text>
<polyline points="145,390 183,378" fill="none" stroke="#AB712B" stroke-width="1.2" />
<circle cx="135" cy="395" r="10" fill="#FFFFFF"/>
<text x="131" y="398.04" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#AB712B" font-weight="700">2</text>
<polyline points="219,292 255,317" fill="none" stroke="#157E7C" stroke-width="1.2" />
<circle cx="210" cy="285" r="10" fill="#FFFFFF"/>
<text x="206" y="288.04" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#157E7C" font-weight="700">3</text>
<text x="692" y="162.64" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#157E7C" font-weight="700">观察点 ①</text>
<text x="692" y="191.96" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#223945" font-weight="400">1  三只感染者聚在门前。</text>
<text x="692" y="213.96" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#223945" font-weight="400">2  深蓝制服尸体在左侧；门卡需靠近取</text>
<text x="692" y="235.96" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#223945" font-weight="400">得。</text>
<text x="692" y="257.96" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#223945" font-weight="400">3  绿色读卡器贴在门旁。</text>
<text x="692" y="300.72" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#157E7C" font-weight="700">先改变占位，再接近</text>
<text x="692" y="330.96" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#223945" font-weight="400">投瓶区域不在这张画面的视野内。转向</text>
<text x="692" y="351.96" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#223945" font-weight="400">西北工位投掷，使敌人离开入口，再从</text>
<text x="692" y="372.96" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#223945" font-weight="400">尸体一侧靠近读卡器。</text>
<text x="692" y="428.66" font-family="Microsoft YaHei, sans-serif" font-size="10.5" fill="#526771" font-weight="400">进入后沿行政走廊向东，经 D 到配电间；回程从</text>
<text x="692" y="443.66" font-family="Microsoft YaHei, sans-serif" font-size="10.5" fill="#526771" font-weight="400">C 接回电梯一侧。详见 P2。</text>
<text x="38" y="530.64" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#223945" font-weight="700">信息怎样转成行动</text>
<text x="38" y="560.88" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#223945" font-weight="400">尸体提供取卡目标，读卡器说明卡的用途，感染者占位制造时机问题。取卡无需背包界面，减少近敌操作层级；仍需承担脚步、接近与投掷失误</text>
<text x="38" y="582.88" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#223945" font-weight="400">的风险。</text>
<polyline points="38,627 922,627" fill="none" stroke="#C8D1D0" stroke-width="0.7" />
<text x="38" y="647.66" font-family="Microsoft YaHei, sans-serif" font-size="10.5" fill="#526771" font-weight="400">林顺  /  封锁区：零号大厦  /  关卡设计与玩法机制</text>
<text x="886" y="645.2" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#526771" font-weight="400">03 / 10</text>
<text x="38" y="612.66" font-family="Microsoft YaHei, sans-serif" font-size="10.5" fill="#526771" font-weight="400">标注对应实际可见物体；卡片细节在此距离不清晰。尸体与读卡器能否被首次玩家主动关联，仍是重点试玩问题。</text></svg></section>
<section id="page-4"><svg viewBox="0 0 960 675" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="960" height="675" fill="#F4F3EE" stroke="none" stroke-width="1"/>
<rect x="38" y="32" width="28" height="4" fill="#157E7C" stroke="none" stroke-width="1"/>
<text x="77" y="35.120000000000005" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#157E7C" font-weight="700">TEACHING / 04</text>
<text x="38" y="82.68" font-family="Microsoft YaHei, sans-serif" font-size="29" fill="#223945" font-weight="700">先留下物资线索，再让回访兑现</text>
<text x="38" y="111.96000000000001" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#526771" font-weight="400">撬棍承担主线开路，手电服务可选探索；避免把所有奖励都串成离开楼层的必经任务。</text>
<image href="assets/pantry_entry.jpg" x="38.0" y="143.00125" width="431.0" height="242.4375"/>
<image href="assets/pantry_lit_crop.jpg" x="491.0" y="143.00124999999997" width="431.00000000000006" height="242.43750000000003"/>
<polyline points="375,170 405,190" fill="none" stroke="#AB712B" stroke-width="1.2" />
<circle cx="367" cy="165" r="10" fill="#FFFFFF"/>
<text x="363" y="168.04" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#AB712B" font-weight="700">1</text>
<polyline points="188,286 239,286" fill="none" stroke="#157E7C" stroke-width="1.2" />
<circle cx="178" cy="286" r="10" fill="#FFFFFF"/>
<text x="174" y="289.04" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#157E7C" font-weight="700">2</text>
<polyline points="855,230 798,257" fill="none" stroke="#AB712B" stroke-width="1.2" />
<circle cx="865" cy="226" r="10" fill="#FFFFFF"/>
<text x="861" y="229.04" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#AB712B" font-weight="700">3</text>
<text x="38" y="414.64" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#157E7C" font-weight="700">初见 11：知道里面有东西</text>
<text x="38" y="445.88" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#223945" font-weight="400">急救标识①、门口血迹与深处制服②建立物资预期。奖励放在更深</text>
<text x="38" y="467.88" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#223945" font-weight="400">处，入口不直接展示枪和急救包。</text>
<text x="491" y="414.64" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#157E7C" font-weight="700">06 得到手电后：返回确认</text>
<text x="491" y="445.88" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#223945" font-weight="400">同一茶水间深处，手电照见枪与急救包③。回访把先前的信息转为资</text>
<text x="491" y="467.88" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#223945" font-weight="400">源收益；不取这些奖励也可完成保险丝主线。</text>
<rect x="38" y="516" width="884" height="76" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<text x="52" y="541.8" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#AB712B" font-weight="700">当前取舍与问题</text>
<text x="223" y="539.96" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#223945" font-weight="400">两件奖励必须“持有且开启手电”才能拾取，是明确的权限条件，不能仅用黑暗解释。若玩家先辨认出物品却无法拿</text>
<text x="223" y="559.96" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#223945" font-weight="400">取，反馈可能不合直觉；这一点保留为待优化问题。</text>
<polyline points="38,627 922,627" fill="none" stroke="#C8D1D0" stroke-width="0.7" />
<text x="38" y="647.66" font-family="Microsoft YaHei, sans-serif" font-size="10.5" fill="#526771" font-weight="400">林顺  /  封锁区：零号大厦  /  关卡设计与玩法机制</text>
<text x="886" y="645.2" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#526771" font-weight="400">04 / 10</text>
<text x="38" y="612.66" font-family="Microsoft YaHei, sans-serif" font-size="10.5" fill="#526771" font-weight="400">左图为入口，右图裁切放大深处奖励，拍摄位置不同；未修改亮度，不是同机位提亮对比。</text></svg></section>
<section id="page-5"><svg viewBox="0 0 960 675" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="960" height="675" fill="#F4F3EE" stroke="none" stroke-width="1"/>

<text x="38" y="82.68" font-family="Microsoft YaHei, sans-serif" font-size="29" fill="#223945" font-weight="700">风道从“覆盖全层”收束为一条绕行</text>
<text x="38" y="111.96000000000001" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#526771" font-weight="400">取舍：让风道解决 B 门的局部阻挡，同时保留进入行政区后的地面探索。</text>
<rect x="38" y="144" width="430" height="208" fill="#FFFFFF" stroke="none" stroke-width="1"/>

<rect x="644" y="159" width="126" height="42" fill="#E0E9E6" stroke="none" stroke-width="1"/>
<text x="656" y="183.04" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#223945" font-weight="400">10 会议室</text>

<text x="793" y="183.04" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#223945" font-weight="400">11-12</text>
<rect x="507" y="290" width="126" height="42" fill="#E4DFE9" stroke="none" stroke-width="1"/>
<text x="518" y="313.04" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#223945" font-weight="400">02 / 04</text>
<rect x="644" y="290" width="126" height="42" fill="#E4DFE9" stroke="none" stroke-width="1"/>
<text x="655" y="313.04" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#223945" font-weight="400">06 档案室</text>

<text x="792" y="313.04" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#223945" font-weight="400">07 配电间</text>
<text x="618" y="244.96" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#526771" font-weight="400">03 中央办公区</text>
<polyline points="702,194 767,194 767,264 702,264 702,286" fill="none" stroke="#7958A0" stroke-width="3" stroke-dasharray="5 4"/>
<polyline points="698.9552412612214,279.69687028353127 702,286 705.0447587387786,279.69687028353127" fill="none" stroke="#7958A0" stroke-width="3" />
<circle cx="702" cy="194" r="5" fill="#7958A0"/>
<circle cx="702" cy="290" r="5" fill="#7958A0"/>
<text x="38" y="381.64" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#526771" font-weight="700">原方案：各区均有风道出入口</text>
<text x="38" y="412.88" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#223945" font-weight="400">沿全层分布的高位网络，几乎处处可下。它支持广泛绕行，也让安全</text>
<text x="38" y="434.88" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#223945" font-weight="400">通路覆盖了多个地面问题。</text>
<text x="492" y="381.64" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#7958A0" font-weight="700">当前：10 进入，06 离开</text>
<text x="492" y="412.88" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#223945" font-weight="400">保留推柜、攀爬和风道体验，删除其余出入口。玩家绕开 B 门后落到</text>
<text x="492" y="434.88" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#223945" font-weight="400">行政区，仍需从 D 去配电间、经 C 返回。</text>
<polyline points="38,480 922,480" fill="none" stroke="#C8D1D0" stroke-width="1" />
<text x="38" y="511.72" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#223945" font-weight="700">为什么不保留全网？</text>
<text x="38" y="540.96" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#223945" font-weight="400">全网提供更多落点，却削弱了两条路线的差异；收束后可选择的落点更少，</text>
<text x="38" y="561.96" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#223945" font-weight="400">换来更明确的风险交换与汇合位置。</text>
<text x="492" y="511.72" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#223945" font-weight="700">付出的代价与下一步</text>
<text x="492" y="540.96" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#223945" font-weight="400">牺牲自由穿行与立体探索范围。现有通行检查支持 10→06；是否因绕行过</text>
<text x="492" y="561.96" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#223945" font-weight="400">长而被玩家放弃，尚需与 B 门一起试玩。</text>
<polyline points="38,627 922,627" fill="none" stroke="#C8D1D0" stroke-width="0.7" />
<text x="38" y="647.66" font-family="Microsoft YaHei, sans-serif" font-size="10.5" fill="#526771" font-weight="400">林顺  /  封锁区：零号大厦  /  关卡设计与玩法机制</text>
<text x="886" y="645.2" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#526771" font-weight="400">05 / 10</text>
<text x="38" y="612.66" font-family="Microsoft YaHei, sans-serif" font-size="10.5" fill="#526771" font-weight="400">两图均为关系示意，非旧实机或等比地图。前后入口方案有迭代记录；路线偏好未做玩家对比测试。</text></svg></section>
<section id="page-6"><svg viewBox="0 0 960 675" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="960" height="675" fill="#F4F3EE" stroke="none" stroke-width="1"/>
<rect x="38" y="32" width="28" height="4" fill="#157E7C" stroke="none" stroke-width="1"/>
<text x="77" y="35.120000000000005" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#157E7C" font-weight="700">MECHANICS / 06</text>
<text x="38" y="82.68" font-family="Microsoft YaHei, sans-serif" font-size="29" fill="#223945" font-weight="700">诱导窗口由几条同时运行的计时构成</text>
<text x="38" y="111.96000000000001" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#526771" font-weight="400">瓶子改写敌人的调查位置；刷门的安全窗口从门全开才开始，不应把所有秒数顺序相加。</text>
<rect x="38" y="144" width="166" height="90" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<rect x="38" y="144" width="166" height="3" fill="#157E7C" stroke="none" stroke-width="1"/>
<text x="49" y="170.8" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#157E7C" font-weight="700">瓶子落地</text>
<text x="49" y="197.04" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#223945" font-weight="400">声音被有效接收</text>
<polyline points="205,185 214,185" fill="none" stroke="#157E7C" stroke-width="2" />
<polyline points="207.69687028353127,188.04475873877863 214,185 207.69687028353127,181.95524126122137" fill="none" stroke="#157E7C" stroke-width="2" />
<rect x="217" y="144" width="166" height="90" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<rect x="217" y="144" width="166" height="3" fill="#157E7C" stroke="none" stroke-width="1"/>
<text x="228" y="170.8" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#157E7C" font-weight="700">响应并离门</text>
<text x="228" y="197.04" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#223945" font-weight="400">转向后走向落点</text>
<polyline points="384,185 393,185" fill="none" stroke="#157E7C" stroke-width="2" />
<polyline points="386.69687028353127,188.04475873877863 393,185 386.69687028353127,181.95524126122137" fill="none" stroke="#157E7C" stroke-width="2" />
<rect x="396" y="144" width="166" height="90" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<rect x="396" y="144" width="166" height="3" fill="#AB712B" stroke="none" stroke-width="1"/>
<text x="407" y="170.8" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#AB712B" font-weight="700">接近并取卡</text>
<text x="407" y="197.04" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#223945" font-weight="400">取决于玩家行动</text>
<polyline points="563,185 572,185" fill="none" stroke="#157E7C" stroke-width="2" />
<polyline points="565.6968702835312,188.04475873877863 572,185 565.6968702835312,181.95524126122137" fill="none" stroke="#157E7C" stroke-width="2" />
<rect x="575" y="144" width="166" height="90" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<rect x="575" y="144" width="166" height="3" fill="#157E7C" stroke="none" stroke-width="1"/>
<text x="586" y="170.8" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#157E7C" font-weight="700">刷卡 / 进门</text>
<text x="586" y="197.04" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#223945" font-weight="400">门从关闭到全开</text>
<polyline points="742,185 751,185" fill="none" stroke="#157E7C" stroke-width="2" />
<polyline points="744.6968702835312,188.04475873877863 751,185 744.6968702835312,181.95524126122137" fill="none" stroke="#157E7C" stroke-width="2" />
<rect x="754" y="144" width="166" height="90" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<rect x="754" y="144" width="166" height="3" fill="#157E7C" stroke="none" stroke-width="1"/>
<text x="765" y="170.8" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#157E7C" font-weight="700">门关闭</text>
<text x="765" y="197.04" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#223945" font-weight="400">满足时间与占用条件</text>
<text x="38" y="254.66" font-family="Microsoft YaHei, sans-serif" font-size="10.5" fill="#526771" font-weight="400">横轴仅表示事件顺序，不是等比时轴；离门、接近和进门的耗时随落点、距离、导航与操作变化。</text>
<text x="38" y="289.96" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#526771" font-weight="700">开始计时的事件</text>
<text x="281" y="289.96" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#526771" font-weight="700">当前参数</text>
<text x="450" y="289.96" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#526771" font-weight="700">设计作用与边界</text>
<rect x="38" y="304" width="884" height="50" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<text x="50" y="326.5" font-family="Microsoft YaHei, sans-serif" font-size="12.5" fill="#223945" font-weight="400">新声源触发警觉</text>
<text x="281" y="326.5" font-family="Microsoft YaHei, sans-serif" font-size="12.5" fill="#157E7C" font-weight="700">转向约 0.65 s</text>
<text x="450" y="324.5" font-family="Microsoft YaHei, sans-serif" font-size="12.5" fill="#223945" font-weight="400">把“听见”与移动分开，让玩家能辨认反应。</text>
<rect x="38" y="359" width="884" height="50" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<text x="50" y="381.5" font-family="Microsoft YaHei, sans-serif" font-size="12.5" fill="#223945" font-weight="400">接收到瓶子等强声</text>
<text x="281" y="381.5" font-family="Microsoft YaHei, sans-serif" font-size="12.5" fill="#157E7C" font-weight="700">调查承诺 12 s</text>
<text x="450" y="379.5" font-family="Microsoft YaHei, sans-serif" font-size="12.5" fill="#223945" font-weight="400">期间弱电台不覆盖目标；并非 12 秒无敌或保证通路畅通。</text>
<rect x="38" y="414" width="884" height="50" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<text x="50" y="436.5" font-family="Microsoft YaHei, sans-serif" font-size="12.5" fill="#223945" font-weight="400">门已完全打开</text>
<text x="281" y="436.5" font-family="Microsoft YaHei, sans-serif" font-size="12.5" fill="#157E7C" font-weight="700">保持 7 s</text>
<text x="450" y="434.5" font-family="Microsoft YaHei, sans-serif" font-size="12.5" fill="#223945" font-weight="400">覆盖刷门后的穿越，不包含此前取卡时间；有人占门则继续开着。</text>
<rect x="38" y="469" width="884" height="50" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<text x="50" y="491.5" font-family="Microsoft YaHei, sans-serif" font-size="12.5" fill="#223945" font-weight="400">进入声源附近搜索</text>
<text x="281" y="491.5" font-family="Microsoft YaHei, sans-serif" font-size="12.5" fill="#157E7C" font-weight="700">B 群搜索 8 s</text>
<text x="450" y="489.5" font-family="Microsoft YaHei, sans-serif" font-size="12.5" fill="#223945" font-weight="400">没有新线索才结束；电台按自身 14 s 周期呼叫，可能再次吸引。</text>
<text x="38" y="555.8" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#157E7C" font-weight="700">关键关系</text>
<text x="159" y="553.96" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#223945" font-weight="400">12 秒承诺与敌人移动、玩家取卡同时进行。弱呼叫不能立刻拉回它们；承诺结束也不强制回门。7 秒保持到期且门口清空至少 1.2</text>
<text x="159" y="573.96" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#223945" font-weight="400">秒，才开始闭合。</text>
<polyline points="38,627 922,627" fill="none" stroke="#C8D1D0" stroke-width="0.7" />
<text x="38" y="647.66" font-family="Microsoft YaHei, sans-serif" font-size="10.5" fill="#526771" font-weight="400">林顺  /  封锁区：零号大厦  /  关卡设计与玩法机制</text>
<text x="886" y="645.2" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#526771" font-weight="400">06 / 10</text>
<text x="38" y="612.66" font-family="Microsoft YaHei, sans-serif" font-size="10.5" fill="#526771" font-weight="400">站立、转头不发脚步声；近身接触仍有危险。投瓶失误允许重试，关闭电台只停止后续发声，不清空搜索记忆。</text></svg></section>
<section id="page-7"><svg viewBox="0 0 960 675" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="960" height="675" fill="#F4F3EE" stroke="none" stroke-width="1"/>
<rect x="38" y="32" width="28" height="4" fill="#157E7C" stroke="none" stroke-width="1"/>
<text x="77" y="35.120000000000005" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#157E7C" font-weight="700">CLIMAX / 07</text>
<text x="38" y="82.68" font-family="Microsoft YaHei, sans-serif" font-size="29" fill="#223945" font-weight="700">把撬门留作收尾，而非背身战斗考验</text>
<text x="38" y="111.96000000000001" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#526771" font-weight="400">交互前允许自由应对，主动开始后转入受保护的交互式逃生演出。</text>
<image href="assets/bench.jpg" x="38.0" y="144.03125" width="279.0" height="156.9375"/>
<image href="assets/pry.jpg" x="338.0" y="144.03125" width="279.0" height="156.9375"/>
<image href="assets/garage.jpg" x="638.0" y="144.125" width="284.0" height="159.75"/>
<text x="38" y="334.64" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#157E7C" font-weight="700">开场：先认出工具的用途</text>
<text x="38" y="365.88" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#223945" font-weight="400">出口卡住，附近维修台提供撬棍。允许先拿</text>
<text x="38" y="387.88" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#223945" font-weight="400">工具再检查门；成功撬开后，金属声引来教</text>
<text x="38" y="409.88" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#223945" font-weight="400">学感染者。</text>
<text x="338" y="334.64" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#157E7C" font-weight="700">结尾：工具成为逃生手段</text>
<text x="338" y="365.88" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#223945" font-weight="400">电梯卡门声带来威胁。玩家决定开始时机；</text>
<text x="338" y="387.88" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#223945" font-weight="400">按住推进门开度，完成后自动入厢回身、夹</text>
<text x="338" y="409.88" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#223945" font-weight="400">手关门。</text>
<text x="638" y="334.64" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#157E7C" font-weight="700">闭门：短暂安全后重建目标</text>
<text x="638" y="365.88" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#223945" font-weight="400">保留玩家、摄像机与轿厢，闭门下行阶段准备</text>
<text x="638" y="387.88" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#223945" font-weight="400">并生成车库。再开门时看到新的车辆与出口关</text>
<text x="638" y="409.88" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#223945" font-weight="400">系。</text>
<rect x="38" y="470" width="884" height="115" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<text x="53" y="497.72" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#AB712B" font-weight="700">从可中断交互到受控收尾</text>
<text x="53" y="527.96" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#223945" font-weight="400">面朝门持续操作时，很难同时判断背后威胁。保留自由战斗能增加临场变化，却会与发力操作争夺注意力；当前选择在开始后隔离普通敌人伤害，牺</text>
<text x="53" y="548.96" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#223945" font-weight="400">牲这段战术自由，换取明确的关卡结束。</text>
<polyline points="38,627 922,627" fill="none" stroke="#C8D1D0" stroke-width="0.7" />
<text x="38" y="647.66" font-family="Microsoft YaHei, sans-serif" font-size="10.5" fill="#526771" font-weight="400">林顺  /  封锁区：零号大厦  /  关卡设计与玩法机制</text>
<text x="886" y="645.2" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#526771" font-weight="400">07 / 10</text>
<text x="38" y="612.66" font-family="Microsoft YaHei, sans-serif" font-size="10.5" fill="#526771" font-weight="400">回收的是撬棍用途与动作认知，前后输入方式不同。约 20 秒电梯连续附件为无声实录；夹手仍是几何占位。</text></svg></section>
<section id="page-8"><svg viewBox="0 0 960 675" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="960" height="675" fill="#F4F3EE" stroke="none" stroke-width="1"/>
<rect x="38" y="32" width="28" height="4" fill="#157E7C" stroke="none" stroke-width="1"/>
<text x="77" y="35.120000000000005" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#157E7C" font-weight="700">INTERACTION / 08</text>
<text x="38" y="82.68" font-family="Microsoft YaHei, sans-serif" font-size="29" fill="#223945" font-weight="700">用状态边界管理输入、保护与交接</text>
<text x="38" y="111.96000000000001" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#526771" font-weight="400">一处启动，一条连续流程；松开只暂停发力，不退出演出。</text>
<rect x="38" y="144" width="166" height="90" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<rect x="38" y="144" width="166" height="3" fill="#157E7C" stroke="none" stroke-width="1"/>
<text x="49" y="170.8" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#157E7C" font-weight="700">呼梯 / 运行</text>
<text x="49" y="197.04" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#223945" font-weight="400">按钮仅负责呼梯</text>
<polyline points="205,185 214,185" fill="none" stroke="#AB712B" stroke-width="2" />
<polyline points="207.69687028353127,188.04475873877863 214,185 207.69687028353127,181.95524126122137" fill="none" stroke="#AB712B" stroke-width="2" />
<rect x="217" y="144" width="166" height="90" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<rect x="217" y="144" width="166" height="3" fill="#157E7C" stroke="none" stroke-width="1"/>
<text x="228" y="170.8" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#157E7C" font-weight="700">停稳卡门</text>
<text x="228" y="197.04" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#223945" font-weight="400">中央门缝可交互</text>
<polyline points="384,185 393,185" fill="none" stroke="#AB712B" stroke-width="2" />
<polyline points="386.69687028353127,188.04475873877863 393,185 386.69687028353127,181.95524126122137" fill="none" stroke="#AB712B" stroke-width="2" />
<rect x="396" y="144" width="166" height="90" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<rect x="396" y="144" width="166" height="3" fill="#AB712B" stroke="none" stroke-width="1"/>
<text x="407" y="170.8" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#AB712B" font-weight="700">发力</text>
<text x="407" y="197.04" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#223945" font-weight="400">按住推进，松开暂停</text>
<polyline points="563,185 572,185" fill="none" stroke="#AB712B" stroke-width="2" />
<polyline points="565.6968702835312,188.04475873877863 572,185 565.6968702835312,181.95524126122137" fill="none" stroke="#AB712B" stroke-width="2" />
<rect x="575" y="144" width="166" height="90" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<rect x="575" y="144" width="166" height="3" fill="#AB712B" stroke="none" stroke-width="1"/>
<text x="586" y="170.8" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#AB712B" font-weight="700">自动入厢</text>
<text x="586" y="197.04" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#223945" font-weight="400">角色与镜头一起移动</text>
<polyline points="742,185 751,185" fill="none" stroke="#AB712B" stroke-width="2" />
<polyline points="744.6968702835312,188.04475873877863 751,185 744.6968702835312,181.95524126122137" fill="none" stroke="#AB712B" stroke-width="2" />
<rect x="754" y="144" width="166" height="90" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<rect x="754" y="144" width="166" height="3" fill="#AB712B" stroke="none" stroke-width="1"/>
<text x="765" y="170.8" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#AB712B" font-weight="700">关门 / 下行</text>
<text x="765" y="197.04" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#223945" font-weight="400">全闭后下行交接</text>
<text x="38" y="279.96" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#526771" font-weight="700">阶段</text>
<text x="238" y="279.96" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#526771" font-weight="700">玩家能做什么</text>
<text x="598" y="279.96" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#526771" font-weight="700">必须守住的边界</text>
<rect x="38" y="297" width="884" height="62" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<text x="51" y="319.88" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#223945" font-weight="700">门缝启动前</text>
<text x="238" y="316.96" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#223945" font-weight="400">自由移动、观察和应对威胁。</text>
<text x="598" y="316.96" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#223945" font-weight="400">检查距离、朝向、遮挡与工具；按钮不触发 QTE。</text>
<rect x="38" y="366" width="884" height="62" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<text x="51" y="388.88" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#223945" font-weight="700">对齐与有效发力</text>
<text x="238" y="385.96" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#223945" font-weight="400">约 3.6 秒有效按住；松开保留进度。</text>
<text x="238" y="405.96" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#223945" font-weight="400">暂停仍可用，其余世界操作锁定。</text>
<text x="598" y="385.96" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#223945" font-weight="400">不接受重复启动；普通敌人不伤害或推挤玩家。</text>
<rect x="38" y="435" width="884" height="62" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<text x="51" y="457.88" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#223945" font-weight="700">入厢、关门与下行</text>
<text x="238" y="454.96" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#223945" font-weight="400">自动跨过门槛并回身，继续受保护。</text>
<text x="598" y="454.96" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#223945" font-weight="400">角色完整进入才关门；门全闭才下降；车库未准备好</text>
<text x="598" y="474.96" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#223945" font-weight="400">则闭门等待。</text>
<rect x="38" y="504" width="884" height="62" fill="#FFFFFF" stroke="none" stroke-width="1"/>

<text x="598" y="523.96" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#223945" font-weight="400">统一清理控制锁、保护与临时对象，避免重试遗留状</text>
<text x="598" y="543.96" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#223945" font-weight="400">态。</text>

<text x="39" y="439.66" font-family="Microsoft YaHei, sans-serif" font-size="10.5" fill="#526771" font-weight="400">主体 48 × 32 m；中间通道 7 m；坡道宽 8 m、实长 24 m。</text>
<text x="39" y="462.66" font-family="Microsoft YaHei, sans-serif" font-size="10.5" fill="#526771" font-weight="400">按生成坐标示意；坡道长度在图中压缩。虚线为可行路线示意。</text>
<image href="assets/truck.jpg" x="594.0" y="147.0" width="328.0" height="184.5"/>
<text x="594" y="347.66" font-family="Microsoft YaHei, sans-serif" font-size="10.5" fill="#526771" font-weight="400">实机：斜停皮卡、半开驾驶门与车内灯。</text>
<text x="594" y="389.56" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#157E7C" font-weight="700">被打断的撤离，仍可继续</text>
<text x="594" y="419.88" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#223945" font-weight="400">出口门缝透光却无法通行，旁边玻璃岗亭可见控制</text>
<text x="594" y="441.88" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#223945" font-weight="400">台。撬门、按一次按钮恢复开闸；噪声引 Boss 去出</text>
<text x="594" y="463.88" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#223945" font-weight="400">口，玩家回到车辆实际位置，撞倒或绕过后撤离。</text>
<rect x="38" y="527" width="884" height="58" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<text x="52" y="550.96" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#223945" font-weight="400">双岛同时容纳两种移动方式：步行时绕柱避冲撞；驾驶时保留中央通道与外圈，允许调整再出库。</text>
<text x="52" y="572.04" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#526771" font-weight="400">不强制回到原车位，也不把击杀 Boss 作为开门条件；代价是返程压力随玩家停车策略而变化。</text>
<polyline points="38,627 922,627" fill="none" stroke="#C8D1D0" stroke-width="0.7" />
<text x="38" y="647.66" font-family="Microsoft YaHei, sans-serif" font-size="10.5" fill="#526771" font-weight="400">林顺  /  封锁区：零号大厦  /  关卡设计与玩法机制</text>
<text x="886" y="645.2" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#526771" font-weight="400">09 / 10</text>
<text x="38" y="612.66" font-family="Microsoft YaHei, sans-serif" font-size="10.5" fill="#526771" font-weight="400">刚体自由驾驶原型，非轨道。双岛和坡道已有脚本驾驶记录；手感、首次引导与 Boss 压力仍待真人试玩。</text></svg></section>
<section id="page-10"><svg viewBox="0 0 960 675" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="960" height="675" fill="#F4F3EE" stroke="none" stroke-width="1"/>
<rect x="38" y="32" width="28" height="4" fill="#157E7C" stroke="none" stroke-width="1"/>
<text x="77" y="35.120000000000005" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#157E7C" font-weight="700">AUTHOR / 10</text>
<text x="38" y="82.68" font-family="Microsoft YaHei, sans-serif" font-size="29" fill="#223945" font-weight="700">职责与作品边界</text>
<text x="38" y="111.96000000000001" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#526771" font-weight="400">以空间组织、引导、风险交换和机制边界展示关卡策划能力；不将原型描述为正式成品。</text>
<text x="38" y="161.56" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#157E7C" font-weight="700">设计贡献</text>
<text x="38" y="191.88" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#223945" font-weight="400">关卡布局与南北动线；B 门 / 通风路线、工具教学、可选回访、C</text>
<text x="38" y="213.88" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#223945" font-weight="400">门回路；电梯节奏、车库遭遇与环境引导的取舍和迭代。</text>
<text x="38" y="296.56" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#157E7C" font-weight="700">实现与资源</text>
<text x="38" y="325.88" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#223945" font-weight="400">代码部分使用 Codex / Gemini 辅助实现。美术与动画复用 UE /</text>
<text x="38" y="347.88" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#223945" font-weight="400">GASP、Kenney CC0 及第三方资源；不作为个人独立编程、建模或</text>
<text x="38" y="369.88" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#223945" font-weight="400">动画制作成果。</text>
<text x="493" y="161.56" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#157E7C" font-weight="700">目前的证据</text>
<text x="493" y="191.88" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#223945" font-weight="400">实机截图、电梯连续片段，以及开场、门禁、通风、驾驶和电梯的分</text>
<text x="493" y="213.88" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#223945" font-weight="400">阶段运行检查。规则与画面已有证据，声音核心玩法仍缺少可交付的</text>
<text x="493" y="235.88" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#223945" font-weight="400">有声演示。</text>
<text x="493" y="296.56" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#AB712B" font-weight="700">接下来优先验证</text>
<text x="493" y="325.88" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#223945" font-weight="400">记录首次玩家是否发现门卡、是否选择风道、投瓶后何时行动；再检</text>
<text x="493" y="347.88" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#223945" font-weight="400">验手电拾取门槛、车库返程压力和驾驶手感。跨关卡卡顿与性能尚未</text>
<text x="493" y="369.88" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#223945" font-weight="400">测量。</text>

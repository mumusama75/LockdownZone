<text x="38" y="82.68" font-family="Microsoft YaHei, sans-serif" font-size="29" fill="#223945" font-weight="700">先允许挪车，再制造返程压力</text>
<text x="38" y="111.96000000000001" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#526771" font-weight="400">可玩灰盒 / 迭代中：允许先试驾，也可直接开闸；提前挪车是策略，开闸不会复位车辆。</text>

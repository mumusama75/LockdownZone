<text x="38" y="82.68" font-family="Microsoft YaHei, sans-serif" font-size="29" fill="#223945" font-weight="700">风道从“覆盖全层”收束为一条绕行</text>
<text x="38" y="111.96000000000001" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#526771" font-weight="400">取舍：让风道解决 B 门的局部阻挡，同时保留进入行政区后的地面探索。</text>

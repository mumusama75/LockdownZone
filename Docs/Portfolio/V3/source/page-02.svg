<text x="38" y="612.66" font-family="Microsoft YaHei, sans-serif" font-size="10.5" fill="#526771" font-weight="400">① 对应下一页 B 门实机视角；家具省略。地面玩家可从 D04 进 06，两条路线均经 D 前往配电间。</text></svg>
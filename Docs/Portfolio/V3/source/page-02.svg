<text x="650" y="192.88" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#223945" font-weight="400">从观察点①确认门口威胁，再投瓶引开、靠</text>
<text x="650" y="215.88" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#223945" font-weight="400">近取卡、刷门。</text>
<text x="650" y="238.88" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#223945" font-weight="400">把风险集中在一段可观察的接近过程，考验</text>
<text x="650" y="261.88" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#223945" font-weight="400">落点与行动时机。</text>
<text x="650" y="310.64" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#7958A0" font-weight="700">通风 · 绕行，操作成本</text>
<text x="650" y="338.88" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#223945" font-weight="400">经 A 到 10 会议室，推柜攀入风道，从 06</text>
<text x="650" y="361.88" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#223945" font-weight="400">离开。</text>
<text x="650" y="384.88" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#223945" font-weight="400">用绕行和操作成本换取避开 B 门聚集区；到</text>
<text x="650" y="407.88" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#223945" font-weight="400">行政区后仍需走向配电间。</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#0f172a; font-family:'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <radialGradient id="pinkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#ec4899" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad3)" />
  <rect x="20" y="20" width="1160" height="635" rx="8" fill="none" stroke="#334155" stroke-width="2" />

  <!-- Header Banner -->
  <rect x="20" y="20" width="1160" height="60" rx="8" fill="#1e293b" />
  <text x="50" y="58" fill="#38bdf8" font-size="20" font-weight="bold">【设计标注图 03】中段框架视线：北侧休憩区高价值战利品透视 (Framed Sightline Route A)</text>
  <text x="960" y="58" fill="#94a3b8" font-size="14">对应实机: SliceQA_07b_OptionalServerParts</text>

  <!-- Main Corridor Path (Bottom to Top / Left to Right) -->
  <rect x="80" y="320" width="1040" height="150" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
  <text x="120" y="405" fill="#64748b" font-size="16" font-weight="bold">主走廊通道 (Main Corridor Y=0)</text>

  <!-- Central Junction DP-2 -->
  <g transform="translate(360, 340)">
    <circle cx="50" cy="50" r="30" fill="#0284c7" stroke="#38bdf8" stroke-width="3" />
    <text x="50" y="56" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">决策点 DP-2</text>
    <text x="50" y="105" text-anchor="middle" fill="#94a3b8" font-size="12">坐标: (650, 0)</text>
    <text x="50" y="125" text-anchor="middle" fill="#38bdf8" font-size="12">中央立柱枢纽</text>
  </g>

  <!-- Central Pillar Signage -->
  <g transform="translate(520, 340)">
    <rect x="0" y="0" width="140" height="90" rx="4" fill="#1e293b" stroke="#eab308" stroke-width="2" />
    <rect x="10" y="10" width="120" height="30" rx="2" fill="#0284c7" />
    <text x="70" y="30" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">[04 POWER -></text>
    <rect x="10" y="50" width="120" height="30" rx="2" fill="#d97706" />
    <text x="70" y="70" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">[03 SERVER -></text>
  </g>

  <!-- Partition Walls creating the Frame Window -->
  <rect x="320" y="120" width="140" height="160" rx="4" fill="#1e293b" stroke="#475569" stroke-width="2" />
  <text x="390" y="205" text-anchor="middle" fill="#94a3b8" font-size="13">办公隔断墙</text>
  
  <rect x="620" y="120" width="140" height="160" rx="4" fill="#1e293b" stroke="#475569" stroke-width="2" />
  <text x="690" y="205" text-anchor="middle" fill="#94a3b8" font-size="13">办公书柜架</text>

  <!-- Gap Frame (Sight Window) -->
  <rect x="465" y="115" width="150" height="170" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,4" />
  <text x="540" y="105" text-anchor="middle" fill="#fde047" font-size="13" font-weight="bold">【框架视窗 (Framed Gap)】</text>

  <!-- Framed Target: North Lounge Desk with Elevated Server Parts A -->
  <g transform="translate(480, 135)">
    <circle cx="60" cy="50" r="55" fill="url(#pinkGlow)" />
    <rect x="25" y="30" width="70" height="40" rx="4" fill="#9d174d" stroke="#f43f5e" stroke-width="2" />
    <text x="60" y="55" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">$500</text>
    <text x="60" y="85" text-anchor="middle" fill="#f472b6" font-size="12" font-weight="bold">服务器备件 A</text>
    <text x="60" y="105" text-anchor="middle" fill="#fbcfe8" font-size="11">高度抬升至桌台(+78cm)</text>
  </g>

  <!-- Medical Kit in North Lounge -->
  <g transform="translate(680, 140)">
    <rect x="10" y="10" width="35" height="30" rx="3" fill="#15803d" stroke="#22c55e" stroke-width="1.5" />
    <text x="27" y="30" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">+</text>
    <text x="80" y="30" fill="#86efac" font-size="12">医疗包 (+35 HP)</text>
  </g>

  <!-- Sight Cone from DP-2 into North Gap -->
  <path d="M 400 340 L 470 280 L 610 280 Z" fill="#f59e0b" fill-opacity="0.15" />
  <path d="M 410 350 L 530 210" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrowGold)" />
  <text x="490" y="305" fill="#fde047" font-size="12" font-weight="bold">主视角直接捕获粉色光晕</text>

  <!-- Route Choices -->
  <!-- Direct Path -->
  <path d="M 420 390 L 1050 390" fill="none" stroke="#38bdf8" stroke-width="3.5" marker-end="url(#arrowBlue)" />
  <text x="750" y="420" fill="#38bdf8" font-size="13" font-weight="bold">【主线路径】直奔配电与撤离点（0绕行 / 0额外风险 / 收益 $0）</text>

  <!-- Detour Path -->
  <path d="M 410 340 Q 430 260 520 230 Q 600 230 780 230 Q 900 260 920 340" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="5,5" marker-end="url(#arrowGold)" />
  <text x="780" y="270" fill="#fde047" font-size="13" font-weight="bold">【支线路径 A】绕行 35m 拾取备件+医疗包（占2格 / 收益 $620）</text>

  <!-- Bottom Annotation Box -->
  <rect x="50" y="520" width="1100" height="120" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <text x="70" y="548" fill="#38bdf8" font-size="15" font-weight="bold">设计原理解析与取舍机制 (Design Logic & Trade-offs):</text>
  <text x="70" y="573" fill="#cbd5e1" font-size="13">1. <tspan fill="#fde047">绝不把奖励藏在暗室死角</tspan>：利用隔断门洞与家具摆设构成自然的“取景框”，玩家站在走廊主路就能看清深处的诱惑物，产生清晰的偏离动机。</text>
  <text x="70" y="596" fill="#cbd5e1" font-size="13">2. <tspan fill="#f472b6">高价值物资台面抬升</tspan>：将服务器备件由地表移至 +78cm 的办公台桌，并辅以局部定向补光，彻底消除了平铺地面造成的视野盲区。</text>
  <text x="70" y="619" fill="#cbd5e1" font-size="13">3. <tspan fill="#38bdf8">环形返回闭环</tspan>：北侧支线在拾取完毕后可顺着休息区穿行至北配电室外廊，实现“探索顺道探路”，探索路径与主线回程有机咬合。</text>
</svg>

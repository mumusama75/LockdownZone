<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#0f172a; font-family:'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coneSight" cx="15%" cy="80%" r="75%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.02"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />
  <rect x="20" y="20" width="1160" height="635" rx="8" fill="none" stroke="#334155" stroke-width="2" />

  <!-- Header Banner -->
  <rect x="20" y="20" width="1160" height="60" rx="8" fill="#1e293b" />
  <text x="50" y="58" fill="#38bdf8" font-size="20" font-weight="bold">【设计标注图 01】开场苏醒室：视线构图与初始资源引导 (Wake Room Composition)</text>
  <text x="1000" y="58" fill="#94a3b8" font-size="14">对应实机: SliceQA_01_Opening</text>

  <!-- Room Layout Top-Down & Perspective Integration -->
  <!-- Observation Window -->
  <rect x="750" y="150" width="380" height="340" rx="4" fill="#1e293b" stroke="#475569" stroke-width="2" />
  <rect x="760" y="160" width="360" height="320" fill="#090d16" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="4,4" />
  <!-- Glass Shards hint -->
  <line x1="820" y1="160" x2="940" y2="480" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.4" />
  <line x1="1020" y1="160" x2="880" y2="480" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.4" />
  <text x="830" y="200" fill="#38bdf8" font-size="16" font-weight="bold">[强化防弹观察窗 (-2520, 120)]</text>
  <text x="810" y="230" fill="#94a3b8" font-size="13">开场绝对安全物理隔离 · 允许观察不触发受击</text>

  <!-- Outside Window Zombies -->
  <g transform="translate(860, 280)">
    <circle cx="30" cy="30" r="22" fill="#ef4444" fill-opacity="0.3" stroke="#ef4444" stroke-width="2"/>
    <text x="30" y="35" text-anchor="middle" fill="#ef4444" font-size="12" font-weight="bold">感染者 #1</text>
    <circle cx="120" cy="60" r="22" fill="#ef4444" fill-opacity="0.3" stroke="#ef4444" stroke-width="2"/>
    <text x="120" y="65" text-anchor="middle" fill="#ef4444" font-size="12" font-weight="bold">感染者 #2</text>
    <rect x="-10" y="100" width="180" height="30" rx="4" fill="#7f1d1d" fill-opacity="0.6" stroke="#ef4444" stroke-width="1"/>
    <text x="80" y="120" text-anchor="middle" fill="#fca5a5" font-size="12">未武装保护状态：冻结巡逻</text>
  </g>

  <!-- Desk & Lamp Focus Zone (North Desk) -->
  <rect x="350" y="180" width="280" height="240" rx="6" fill="#1e293b" stroke="#cbd5e1" stroke-width="2" />
  <circle cx="490" cy="270" r="100" fill="url(#lampGlow)" />
  <rect x="420" y="220" width="140" height="90" rx="4" fill="#334155" stroke="#f59e0b" stroke-width="1.5" />
  <text x="490" y="250" text-anchor="middle" fill="#fde047" font-size="15" font-weight="bold">武器桌 (-3100, 490)</text>
  <text x="490" y="275" text-anchor="middle" fill="#ffffff" font-size="13">• 格洛克 17 (残弹 3/0)</text>
  <text x="490" y="295" text-anchor="middle" fill="#38bdf8" font-size="13">• 手电筒 (按 F 开关)</text>
  <text x="490" y="315" text-anchor="middle" fill="#fbbf24" font-size="12">增设: 暖光台灯(240lm)聚焦光斑</text>

  <!-- Player Spawn & Sightline Cone -->
  <g transform="translate(120, 460)">
    <circle cx="40" cy="40" r="24" fill="#0284c7" stroke="#38bdf8" stroke-width="3" />
    <text x="40" y="46" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">玩家</text>
    <text x="40" y="85" text-anchor="middle" fill="#94a3b8" font-size="12">出生点 (-3300, 0)</text>
    <text x="40" y="105" text-anchor="middle" fill="#38bdf8" font-size="12">初始 Yaw: 15° (偏东北)</text>
  </g>

  <!-- Sightline arrows -->
  <!-- Sightline to Window -->
  <path d="M 160 480 Q 450 360 750 320" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="6,6" marker-end="url(#arrowRed)" />
  <rect x="360" y="440" width="220" height="28" rx="4" fill="#1e293b" stroke="#ef4444" stroke-width="1" />
  <text x="470" y="459" text-anchor="middle" fill="#fca5a5" font-size="12">【主视线 1】正前方玻璃外威胁认知</text>

  <!-- Sightline to Weapon Desk -->
  <path d="M 150 460 Q 250 360 380 320" fill="none" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrowAmber)" />
  <rect x="180" y="320" width="180" height="28" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="1" />
  <text x="270" y="339" text-anchor="middle" fill="#fef08a" font-size="12">【次视线 2】左前方台灯光斑汇聚</text>

  <!-- South Axe Cabinet Behind Player -->
  <g transform="translate(100, 160)">
    <rect x="0" y="0" width="180" height="90" rx="4" fill="#1e293b" stroke="#eab308" stroke-width="2" />
    <text x="90" y="30" text-anchor="middle" fill="#fde047" font-size="14" font-weight="bold">消防斧背板 (-3300,-400)</text>
    <text x="90" y="55" text-anchor="middle" fill="#cbd5e1" font-size="12">• 应急红黄警示条纹</text>
    <text x="90" y="75" text-anchor="middle" fill="#94a3b8" font-size="12">• 备用近战破障工具</text>
  </g>
  <path d="M 130 440 Q 90 320 130 260" fill="none" stroke="#eab308" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowAmber)" />

  <!-- Bottom Annotation Box -->
  <rect x="50" y="525" width="1100" height="110" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <text x="70" y="555" fill="#38bdf8" font-size="15" font-weight="bold">设计原理解析 (Level Design Rationale):</text>
  <text x="70" y="582" fill="#cbd5e1" font-size="13">1. <tspan fill="#fde047">双聚焦构图</tspan>：微调初始朝向至 15°，使危险（窗外感染者）与解法（武器与台灯）同时处于视野 60° 舒适锥内，避免转身寻找武器的无序体验。</text>
  <text x="70" y="605" fill="#cbd5e1" font-size="13">2. <tspan fill="#fca5a5">残弹信息前置</tspan>：拾取手枪即刻弹出 3/0 弹药状态与中文警示，促使玩家克制开火冲动，规划首战破窗与弹药消耗节奏。</text>
  <text x="70" y="628" fill="#cbd5e1" font-size="13">3. <tspan fill="#86efac">安全心流建立</tspan>：在拿起武器前敌人 100% 冻结，玩家获得充足的观察时间与心理准备，达成“观察—获取—决策”的安全教学循环。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#0f172a; font-family:'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <marker id="arrowRedDashed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad4)" />
  <rect x="20" y="20" width="1160" height="635" rx="8" fill="none" stroke="#334155" stroke-width="2" />

  <!-- Header Banner -->
  <rect x="20" y="20" width="1160" height="60" rx="8" fill="#1e293b" />
  <text x="50" y="58" fill="#38bdf8" font-size="20" font-weight="bold">【设计标注图 04】微背包 3×2 容量冲突与空间原子博弈 (Grid Backpack & Trade-off)</text>
  <text x="960" y="58" fill="#94a3b8" font-size="14">对应实机: SliceQA_07d_InventoryFull</text>

  <!-- Left: Grid Conflict Diagram (Failure to Fit) -->
  <g transform="translate(60, 110)">
    <rect x="0" y="0" width="500" height="380" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="2" />
    <text x="20" y="35" fill="#f87171" font-size="16" font-weight="bold">冲突场景：虽有 2 个剩余空格，但无法装入大件！</text>
    
    <!-- 3x2 Grid Table -->
    <g transform="translate(40, 60)">
      <!-- Row 0 -->
      <!-- Slot 0: Ammo -->
      <rect x="0" y="0" width="130" height="90" rx="4" fill="#1e3a8a" stroke="#38bdf8" stroke-width="1.5" />
      <text x="65" y="40" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">9mm 弹药</text>
      <text x="65" y="65" text-anchor="middle" fill="#93c5fd" font-size="12">24 / 30 发</text>
      
      <!-- Slot 1: Medkit -->
      <rect x="145" y="0" width="130" height="90" rx="4" fill="#14532d" stroke="#4ade80" stroke-width="1.5" />
      <text x="210" y="40" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">医疗包</text>
      <text x="210" y="65" text-anchor="middle" fill="#86efac" font-size="12">+35 HP (占1格)</text>

      <!-- Slot 2: Empty A -->
      <rect x="290" y="0" width="130" height="90" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4" />
      <text x="355" y="50" text-anchor="middle" fill="#64748b" font-size="14">[ 空格 A ]</text>

      <!-- Row 1 -->
      <!-- Slot 3: Electronics -->
      <rect x="0" y="105" width="130" height="90" rx="4" fill="#78350f" stroke="#fbbf24" stroke-width="1.5" />
      <text x="65" y="145" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">电子零件</text>
      <text x="65" y="170" text-anchor="middle" fill="#fde047" font-size="12">$120 (占1格)</text>

      <!-- Slot 4: Medkit 2 -->
      <rect x="145" y="105" width="130" height="90" rx="4" fill="#14532d" stroke="#4ade80" stroke-width="1.5" />
      <text x="210" y="145" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">医疗包</text>
      <text x="210" y="170" text-anchor="middle" fill="#86efac" font-size="12">+35 HP (占1格)</text>

      <!-- Slot 5: Empty B -->
      <rect x="290" y="105" width="130" height="90" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4" />
      <text x="355" y="155" text-anchor="middle" fill="#64748b" font-size="14">[ 空格 B ]</text>
    </g>

    <!-- Target Item trying to insert: Server Parts (Requires 2x1 contiguous in same row) -->
    <g transform="translate(60, 275)">
      <rect x="0" y="0" width="275" height="50" rx="4" fill="#9d174d" stroke="#f43f5e" stroke-width="2" stroke-dasharray="6,3" />
      <text x="137" y="32" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">拟拾取: 服务器备件 ($500 / 需同行连续2格)</text>
      
      <path d="M 285 25 Q 380 25 360 -40" fill="none" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrowRedDashed)" />
      <text x="380" y="15" fill="#f87171" font-size="12" font-weight="bold">无法放入！</text>
      <text x="380" y="35" fill="#fca5a5" font-size="11">空格A与B处于不同行，</text>
      <text x="380" y="52" fill="#fca5a5" font-size="11">无法形成同行连续跨度</text>
    </g>

    <!-- HUD Feedback Bar -->
    <rect x="20" y="335" width="460" height="34" rx="4" fill="#7f1d1d" stroke="#ef4444" stroke-width="1" />
    <text x="250" y="358" text-anchor="middle" fill="#fecaca" font-size="12" font-weight="bold">提示：背包空间不足：服务器备件需同行连续2格！[B] 整理或按 [Delete] 丢弃</text>
  </g>

  <!-- Right: Decoupling & Resolution -->
  <g transform="translate(590, 110)">
    <rect x="0" y="0" width="550" height="380" rx="6" fill="#1e293b" stroke="#22c55e" stroke-width="2" />
    <text x="20" y="35" fill="#4ade80" font-size="16" font-weight="bold">机制解耦与玩家主动决策：</text>

    <!-- Key Feature 1: Mission Item Decoupling -->
    <rect x="20" y="55" width="510" height="75" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="40" y="80" fill="#38bdf8" font-size="14" font-weight="bold">【主线保险丝独立槽位 (Decoupled Mission Fuse)】</text>
    <text x="40" y="105" fill="#cbd5e1" font-size="12">• 15A 备用保险丝存放于专属任务栏，<tspan fill="#facc15">完全不消耗 6 格通用背包</tspan>。</text>
    <text x="40" y="122" fill="#94a3b8" font-size="12">• 核心体验价值：避免玩家因贪包装满杂物而无法拾取主线任务道具卡关。</text>

    <!-- Key Feature 2: Active Trade-off (Discard Medkit) -->
    <rect x="20" y="145" width="510" height="105" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="40" y="170" fill="#f59e0b" font-size="14" font-weight="bold">【主动取舍：丢弃生存裕度换取巨额财富】</text>
    <text x="40" y="195" fill="#cbd5e1" font-size="12">• 玩家选择按下 <tspan fill="#ffffff" font-weight="bold">[Delete]</tspan> 键丢弃 Slot 1 或 Slot 4 的医疗包 (+35 HP)。</text>
    <text x="40" y="215" fill="#cbd5e1" font-size="12">• 腾出同行连续两格后，成功装入价值 <tspan fill="#f43f5e" font-weight="bold">$500</tspan> 服务器备件。</text>
    <text x="40" y="235" fill="#86efac" font-size="12">• 心理感受：强烈的“博弈感”——放弃回血保障，进入容错极低的高压撤离状态。</text>

    <!-- Key Feature 3: Atomicity -->
    <rect x="20" y="265" width="510" height="95" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="40" y="290" fill="#a855f7" font-size="14" font-weight="bold">【原子性保护 (Atomic Interaction)】</text>
    <text x="40" y="315" fill="#cbd5e1" font-size="12">• 拾取失败时，场景中的高价值物资<tspan fill="#e9d5ff">绝对不被销毁或吞没</tspan>，完好留在台面。</text>
    <text x="40" y="335" fill="#cbd5e1" font-size="12">• 玩家可在任何时候整理完背包后再次拾取，保障操作交互的严谨性与公平感。</text>
  </g>

  <!-- Bottom Annotation Box -->
  <rect x="50" y="520" width="1100" height="120" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <text x="70" y="548" fill="#38bdf8" font-size="15" font-weight="bold">策划维度分析与机制总结 (Design Insights):</text>
  <text x="70" y="573" fill="#cbd5e1" font-size="13">1. <tspan fill="#fde047">网格空间的物理感</tspan>：传统单格数量累加无法促成思考，而 1×2 形态迫使玩家关注“空间几何”，使 6 格背包成为紧凑而生动的策略舞台。</text>
  <text x="70" y="596" fill="#cbd5e1" font-size="13">2. <tspan fill="#f43f5e">非对称回报</tspan>：直接通关可带出 $0，搜刮单侧可达 $620，而极限搜刮双备件可达 $1120，层级分明的结算结果让不同偏好的玩家均能获得匹配的成就感。</text>
  <text x="70" y="619" fill="#cbd5e1" font-size="13">3. <tspan fill="#86efac">回归保障</tspan>：QA 专项断言 68 项精准覆盖 6 格背包开闭、自动堆叠、超载拒收与原子保留，确保真实游玩零丢物 BUG。</text>
</svg>

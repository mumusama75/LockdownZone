<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#0a0f1d; font-family:'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;">
  <defs>
    <linearGradient id="bgGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <radialGradient id="redBeaconGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#b91c1c" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7f1d1d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenExitGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#15803d" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#14532d" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrowRedM" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
    <marker id="arrowGreenM" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#22c55e" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad6)" />
  <rect x="20" y="20" width="1160" height="635" rx="8" fill="none" stroke="#1e293b" stroke-width="2" />

  <!-- Header Banner -->
  <rect x="20" y="20" width="1160" height="60" rx="8" fill="#111827" />
  <text x="50" y="58" fill="#38bdf8" font-size="20" font-weight="bold">【设计标注图 06】返程通电与撤离闭环：北侧配电红塔与气闸复苏 (Breaker & Extraction)</text>
  <text x="960" y="58" fill="#94a3b8" font-size="14">对应实机: SliceQA_08 / SliceQA_09 / SliceQA_10</text>

  <!-- Left: Player leaving South Server with Fuse -->
  <g transform="translate(60, 360)">
    <circle cx="30" cy="30" r="22" fill="#0284c7" stroke="#38bdf8" stroke-width="3" />
    <text x="30" y="36" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">玩家</text>
    <rect x="-10" y="65" width="130" height="45" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="55" y="86" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="bold">已持 15A 保险丝</text>
    <text x="55" y="102" text-anchor="middle" fill="#94a3b8" font-size="11">位于中央走廊交叉口</text>
  </g>

  <!-- North Electrical Room (Destination 1) -->
  <g transform="translate(380, 110)">
    <rect x="0" y="0" width="340" height="240" rx="6" fill="#1e293b" stroke="#b91c1c" stroke-width="2" />
    <!-- High Voltage Stripes -->
    <rect x="0" y="0" width="340" height="24" fill="#7f1d1d" />
    <text x="170" y="18" text-anchor="middle" fill="#fecaca" font-size="12" font-weight="bold">高压危险 · 04 配电控制室 (POWER ROOM)</text>

    <!-- Persistent Red Beacon Beacon on Doorway -->
    <circle cx="170" cy="50" r="35" fill="url(#redBeaconGlow)" />
    <circle cx="170" cy="50" r="10" fill="#fca5a5" />
    <text x="170" y="85" text-anchor="middle" fill="#ef4444" font-size="12" font-weight="bold">常驻红色应急指示塔 (暗夜远景唯一视觉强锚点)</text>

    <!-- Breaker Console inside -->
    <rect x="80" y="120" width="180" height="85" rx="4" fill="#0f172a" stroke="#ef4444" stroke-width="1.5" />
    <text x="170" y="150" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">总配电箱 [E]</text>
    <text x="170" y="175" text-anchor="middle" fill="#fca5a5" font-size="12">插入保险丝并拉闸</text>
    <text x="170" y="195" text-anchor="middle" fill="#86efac" font-size="11">触发: 全大楼照明恢复供电</text>
  </g>

  <!-- Return Path from South to North -->
  <path d="M 120 370 Q 220 230 370 200" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrowRedM)" />
  <rect x="180" y="270" width="160" height="30" rx="4" fill="#111827" stroke="#ef4444" stroke-width="1" />
  <text x="260" y="290" text-anchor="middle" fill="#fca5a5" font-size="12">【返程路径】红塔远视线牵引</text>

  <!-- East Airlock Exit (Destination 2) -->
  <g transform="translate(820, 150)">
    <rect x="0" y="0" width="320" height="300" rx="6" fill="#1e293b" stroke="#22c55e" stroke-width="2" />
    <circle cx="160" cy="50" r="50" fill="url(#greenExitGlow)" />
    <text x="160" y="55" text-anchor="middle" fill="#4ade80" font-size="16" font-weight="bold">&lt; 撤离气闸室 EXIT &gt;</text>
    <text x="160" y="90" text-anchor="middle" fill="#86efac" font-size="12">供电恢复后防爆气闸门自动解锁升起</text>

    <!-- Inside Exit Room -->
    <rect x="30" y="120" width="260" height="150" rx="4" fill="#064e3b" stroke="#4ade80" stroke-width="1.5" />
    <text x="160" y="160" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">全封闭防跌落区域</text>
    <text x="160" y="190" text-anchor="middle" fill="#bbf7d0" font-size="12">• 实体包围盒碰撞 (Z: -50~450)</text>
    <text x="160" y="215" text-anchor="middle" fill="#bbf7d0" font-size="12">• 触碰触发撤离结算成功</text>
    <text x="160" y="240" text-anchor="middle" fill="#fef08a" font-size="12">• 杜绝穿模掉出地图 BUG</text>
  </g>

  <!-- Power Restored Dash Path to Exit -->
  <path d="M 680 230 Q 750 250 810 270" fill="none" stroke="#22c55e" stroke-width="3.5" marker-end="url(#arrowGreenM)" />
  <text x="750" y="235" text-anchor="middle" fill="#86efac" font-size="13" font-weight="bold">通电后直奔气闸</text>

  <!-- Bottom Annotation Box -->
  <rect x="50" y="520" width="1100" height="120" rx="6" fill="#111827" stroke="#334155" stroke-width="1.5" />
  <text x="70" y="548" fill="#38bdf8" font-size="15" font-weight="bold">返程与撤离空间复用原理解析 (Spatial Reuse & Exit Safety):</text>
  <text x="70" y="573" fill="#cbd5e1" font-size="13">1. <tspan fill="#ef4444">暗夜视觉灯塔 (Visual Beacon)</tspan>：北侧配电门楣的常驻红色指示灯在全场断电后依然保持供电，成为黑暗办公区中最强视觉锚点，避免在缺乏小地图时的无序乱撞。</text>
  <text x="70" y="596" fill="#cbd5e1" font-size="13">2. <tspan fill="#4ade80">光影情绪反转</tspan>：拉动总电闸瞬间，全楼日光灯伴随清脆电流声逐级亮起，大厦从阴森压迫转变为明亮开阔，东侧绿色撤离指示成为最终阶段的自然释放。</text>
  <text x="70" y="619" fill="#cbd5e1" font-size="13">3. <tspan fill="#fef08a">气闸防跌落架构修复</tspan>：针对用户此前反馈的“穿过出口掉出地图”缺陷，气闸室全域采用物理包围盒与门限约束，QA 自动化通过 ExtractionSuccess 彻底验证防掉落机制。</text>
</svg>
